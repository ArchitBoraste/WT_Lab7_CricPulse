spring.application.name=cricpulse
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# --- Database (in-memory H2; swap the URL/driver for MySQL or PostgreSQL in production) ---
spring.datasource.url=jdbc:h2:mem:cricpulse;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.h2.console.enabled=true
spring.datasource.hikari.maximum-pool-size=16

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Scheduling ---
spring.task.scheduling.pool.size=2

# --- Live simulation ---
cricpulse.simulation.enabled=true
cricpulse.simulation.seed-demo-data=true
cricpulse.simulation.ball-interval-ms=2500
cricpulse.simulation.skip-probability=0.2
cricpulse.simulation.min-upcoming-fixtures=3
cricpulse.simulation.fixture-gap-seconds=240
cricpulse.simulation.worker-threads=4

# Origins allowed to call the API and open the WebSocket (Vite dev server by default)
cricpulse.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# --- Ops ---
management.endpoints.web.exposure.include=health,info,metrics
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.hibernate.SQL=off
